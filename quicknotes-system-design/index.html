<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QuickNotes</title>
  <link rel="stylesheet" href="style.css">
  <script src="api.js" defer></script>
</head>
<body>
  <div class="container">
    <header>
      <h1>QuickNotes</h1>
      <button id="load-btn">Load notes</button>
    </header>

    <p id="status" role="status" aria-live="polite"></p>

    <section class="form-section">
      <h2>Create a Note</h2>
      <form id="note-form">
        <div class="form-group">
          <label for="title-input">Title (required, max 100 chars):</label>
          <input type="text" id="title-input" required maxlength="100" placeholder="Meeting Summary">
        </div>
        <div class="form-group">
          <label for="body-input">Body:</label>
          <textarea id="body-input" rows="4" placeholder="Write your note here..."></textarea>
        </div>
        <button type="submit" id="submit-btn">Create Note</button>
      </form>
    </section>

    <section class="notes-section">
      <h2>Notes</h2>
      <ul id="notes-list"></ul>
    </section>
  </div>
</body>
</html>
